<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画を探す | Video-Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="product.html">
        <span class="logo-mark" aria-hidden="true"></span>
        <span>Video-Store</span>
      </a>
      <nav class="header-nav">
        <a class="nav-link" data-page="product.html" href="product.html">トップ</a>
        <a class="nav-link" data-page="videos.html" href="videos.html">動画を探す</a>
        <a class="nav-link" data-page="mypage.html" href="mypage.html">マイページ</a>
        <a class="nav-link" data-page="login.html" href="login.html">ログイン</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card section">
      <h1 style="margin-top: 0;">動画を探す</h1>
      <div class="filter-panel">
        <div class="filter-grid">
          <div>
            <label for="searchKeyword">キーワード検索（タイトル）</label>
            <input id="searchKeyword" type="text" placeholder="例: テキストテキスト 01">
          </div>
          <div>
            <label for="filterPrice">価格帯で絞り込み</label>
            <select id="filterPrice">
              <option value="">すべての価格帯</option>
              <option value="0-999">999円以下</option>
              <option value="1000-1499">1,000円〜1,499円</option>
              <option value="1500-99999">1,500円以上</option>
            </select>
          </div>
          <div></div>
          <div>
            <label for="filterCast">出演者で絞り込み</label>
            <select id="filterCast"></select>
          </div>
          <div>
            <label for="filterGenre">ジャンルで絞り込み</label>
            <select id="filterGenre"></select>
          </div>
          <div style="display:flex; align-items:flex-end;">
            <label class="checkbox-row" for="filterSaleOnly">
              <input id="filterSaleOnly" type="checkbox">
              期間限定価格のみ
            </label>
          </div>
        </div>
        <div class="filter-actions">
          <button id="applyFiltersBtn" class="btn btn-primary" type="button">検索</button>
          <button id="resetFiltersBtn" class="btn btn-ghost" type="button">リセット</button>
        </div>
      </div>
      <div class="results-divider" aria-hidden="true"></div>
      <div class="results-header">
        <div>
          <h2 class="results-title">検索結果</h2>
          <p class="helper result-count" id="resultCount">0 / 50 件</p>
        </div>
        <div class="results-sort">
          <label for="sortOrder">並び替え</label>
          <select id="sortOrder">
            <option value="new">新着順</option>
            <option value="price-asc">価格が安い順</option>
            <option value="price-desc">価格が高い順</option>
          </select>
        </div>
      </div>
      <div id="productCatalog" class="video-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
    <div>検索と絞り込みで全動画を探せるモックページ</div>
    <div class="footer-links">
      <a href="tokusho.html">特定商取引法に基づく表記</a>
      <a href="terms.html">利用規約</a>
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="faq.html">よくある質問</a>
      <a href="contact.html">お問い合わせ</a>
    </div>
  
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
