<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログインページ | Video-Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="product.html">
        <span class="logo-mark" aria-hidden="true"></span>
        <span>Video-Store</span>
      </a>
      <nav class="header-nav">
        <a class="nav-link" data-page="product.html" href="product.html">トップ</a>
        <a class="nav-link" data-page="mypage.html" href="mypage.html">マイページ</a>
        <a class="nav-link" data-page="login.html" href="login.html">ログイン</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card login-box">
      <span class="badge">会員ログイン</span>
      <h1>ログインページ</h1>
      <p class="lead">クライアント確認用の簡易ログインです。入力値はダミーで構いません。</p>
      <form id="loginForm">
        <div class="form-row">
          <label for="email">メールアドレス</label>
          <input id="email" type="email" value="demo@example.com" required>
        </div>
        <div class="form-row">
          <label for="password">パスワード</label>
          <input id="password" type="password" value="password" required>
        </div>
        <button class="btn btn-primary" type="submit">ログインして続ける</button>
      </form>
      <p class="helper" style="margin-top:10px;">
        パスワードをお忘れの方は <a href="forgot-password.html">こちら</a>
      </p>
      <p class="helper" style="margin-top:14px;">アカウントをお持ちでない方は <a href="register.html">会員登録はこちら</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
    <div>認証機能は画面遷移確認用のモック実装です</div>
    <div class="footer-links">
      <a href="tokusho.html">特定商取引法に基づく表記</a>
      <a href="terms.html">利用規約</a>
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="faq.html">よくある質問</a>
      <a href="contact.html">お問い合わせ</a>
    </div>
  
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
