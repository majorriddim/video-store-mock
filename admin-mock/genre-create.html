<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新規ジャンル追加 | Video Store Admin Mock</title>
  <link rel="stylesheet" href="./admin-mock.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="brand">
        管理画面      </div>
      <ul class="menu">
        <li><a href="./dashboard.html">ダッシュボード</a></li>
        <li><a href="./videos.html">動画管理</a></li>
        <li><a href="./members.html">会員管理</a></li>
        <li><a href="./orders.html">注文管理</a></li>
        <li><a href="./inquiries.html">お問い合わせ管理</a></li>
        <li><a href="./casts.html">出演者管理</a></li>
        <li><a class="active" href="./genres.html">ジャンル管理</a></li>
        <li><a href="./contents.html">コンテンツ管理</a></li>
        <li><a href="./change-history.html">変更履歴</a></li>
        <li><a href="./news.html">NEWS管理</a></li>
        <li><a href="./rankings.html">運営者セレクト管理</a></li>
        <li><a href="./analytics-dashboard.html">アクセス解析</a></li>
      </ul>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 class="page-title">新規ジャンル追加</h1>
          <p class="page-subtitle">ジャンル情報の新規作成フォーム</p>
        </div>
        <div class="action-row">
          <a class="btn" href="./genres.html">一覧へ戻る</a>
          <button class="btn primary">新規作成する</button>
        </div>
      </header>

      <div class="content">
        <section class="card">
          <div class="card-head"><h2 class="card-title">編集項目</h2></div>
          <div class="card-body form-stack">
            <label class="field"><span>ジャンル名</span><input class="input" type="text" value=""></label>
            <label class="field"><span>説明</span><textarea class="input textarea" rows="8"></textarea></label>
            <label class="field"><span>並び順</span><input class="input" type="number" value=""></label>
            <label class="field"><span>公開状態</span>
              <select class="select">
                <option selected>公開準備中</option>
                <option>公開</option>
                <option>非公開</option>
              </select>
            </label>
            <div class="action-row">
              <button class="btn primary">新規作成する</button>
              <a class="btn" href="./genres.html">一覧へ戻る</a>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
