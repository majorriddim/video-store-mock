  <script>
    (() => {
      const relatedVideoSearch = document.querySelector("#relatedVideoSearch");
      const relatedVideoSelect = document.querySelector("#relatedVideoSelect");
      const addRelatedVideo = document.querySelector("#addRelatedVideo");
      const relatedVideoList = document.querySelector("#relatedVideoList");
      const relatedVideoOrder = document.querySelector("#relatedVideoOrder");

      if (!relatedVideoSearch || !relatedVideoSelect || !addRelatedVideo || !relatedVideoList || !relatedVideoOrder) return;

      const sourceVideos = [
        { id: "VID-1003", title: "繝・く繧ｹ繝医ユ繧ｭ繧ｹ繝・03", cast: "菴占陸 譴ｨ闃ｱ", price: "ﾂ･5,480" },
        { id: "VID-1007", title: "繝・く繧ｹ繝医ユ繧ｭ繧ｹ繝・07", cast: "鬮俶ｩ・鄒主調", price: "ﾂ･5,980" },
        { id: "VID-1012", title: "繝・く繧ｹ繝医ユ繧ｭ繧ｹ繝・12", cast: "驤ｴ譛ｨ 逕ｱ螂・, price: "ﾂ･6,300" },
        { id: "VID-1019", title: "繝・く繧ｹ繝医ユ繧ｭ繧ｹ繝・19", cast: "菴占陸 譴ｨ闃ｱ", price: "ﾂ･6,800" }
      ];

      const getCurrentIds = () => Array.from(relatedVideoList.querySelectorAll(".related-item")).map((item) => item.dataset.id);
      const renderOrder = () => {
        const ids = getCurrentIds();
        relatedVideoOrder.textContent = ids.length ? `陦ｨ遉ｺ鬆・ ${ids.join(", ")}` : "陦ｨ遉ｺ鬆・ 譛ｪ險ｭ螳・;
      };

      const bindItemActions = (item) => {
        item.querySelectorAll("[data-action]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const action = btn.getAttribute("data-action");
            if (action === "remove") {
              item.remove();
              renderOrder();
              return;
            }
            if (action === "move-up" && item.previousElementSibling) {
              relatedVideoList.insertBefore(item, item.previousElementSibling);
              renderOrder();
              return;
            }
            if (action === "move-down" && item.nextElementSibling) {
              relatedVideoList.insertBefore(item.nextElementSibling, item);
              renderOrder();
            }
          });
        });
      };

      const renderSelectOptions = () => {
        const keyword = relatedVideoSearch.value.trim().toLowerCase();
        const usedIds = new Set(getCurrentIds());
        const candidates = sourceVideos.filter((video) => {
          if (usedIds.has(video.id)) return false;
          if (!keyword) return true;
          return `${video.id} ${video.title} ${video.cast}`.toLowerCase().includes(keyword);
        });

        relatedVideoSelect.innerHTML = `<option value="">蜍慕判繧帝∈謚槭＠縺ｦ縺上□縺輔＞</option>` +
          candidates.map((video) => `<option value="${video.id}">${video.id} / ${video.title} / ${video.cast}</option>`).join("");
      };

      const createRelatedItem = (video) => {
        const item = document.createElement("li");
        item.className = "related-item";
        item.dataset.id = video.id;
        item.innerHTML = `
          <div>
            <strong>${video.id} ${video.title}</strong>
            <span>蜃ｺ貍碑・ ${video.cast} / 萓｡譬ｼ: ${video.price}</span>
          </div>
          <div class="related-item-actions">
            <button class="btn link" type="button" data-action="move-up">荳翫∈</button>
            <button class="btn link" type="button" data-action="move-down">荳九∈</button>
            <button class="btn link" type="button" data-action="remove">蜑企勁</button>
          </div>
        `;
        bindItemActions(item);
        return item;
      };

      relatedVideoList.querySelectorAll(".related-item").forEach(bindItemActions);
      renderOrder();
      renderSelectOptions();

      relatedVideoSearch.addEventListener("input", renderSelectOptions);
      addRelatedVideo.addEventListener("click", () => {
        const selectedId = relatedVideoSelect.value;
        if (!selectedId) return;
        const video = sourceVideos.find((item) => item.id === selectedId);
        if (!video) return;
        relatedVideoList.appendChild(createRelatedItem(video));
        renderOrder();
        renderSelectOptions();
      });
    })();
  </script>
