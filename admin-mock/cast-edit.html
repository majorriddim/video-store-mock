<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出演者編集 | Video Store Admin Mock</title>
  <link rel="stylesheet" href="./admin-mock.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="brand">
        Video Store 管理画面
        <span>WordPress + WooCommerce</span>
      </div>
      <ul class="menu">
        <li><a href="./dashboard.html">ダッシュボード</a></li>
        <li><a href="./videos.html">動画管理</a></li>
        <li><a href="./members.html">会員管理</a></li>
        <li><a href="./orders.html">注文管理</a></li>
        <li><a href="./inquiries.html">お問い合わせ管理</a></li>
        <li><a class="active" href="./casts.html">出演者管理</a></li>
        <li><a href="./genres.html">ジャンル管理</a></li>
        <li><a href="./contents.html">コンテンツ管理</a></li>
      </ul>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 class="page-title">出演者編集</h1>
          <p class="page-subtitle">出演者ID: CAST-0012</p>
        </div>
        <div class="action-row">
          <a class="btn" href="./cast-detail.html">詳細へ戻る</a>
          <button class="btn primary">更新する</button>
        </div>
      </header>

      <div class="content">
        <section class="card">
          <div class="card-head"><h2 class="card-title">編集項目</h2></div>
          <div class="card-body form-stack">
            <label class="field"><span>出演者名</span><input class="input" type="text" value="佐藤 梨花"></label>
            <label class="field"><span>紹介文</span><textarea class="input textarea" rows="8">テキストテキスト。出演者紹介文。</textarea></label>
            <label class="field">
              <span>出演者画像（WordPressメディア）</span>
              <div class="action-row">
                <input class="input" type="text" value="/wp-content/uploads/2026/03/cast-0012.jpg">
                <button class="btn" type="button">メディアから選択</button>
              </div>
            </label>
            <label class="field"><span>公開状態</span>
              <select class="select">
                <option selected>公開</option>
                <option>公開準備中</option>
                <option>非公開</option>
              </select>
            </label>
            <div class="field">
              <span>おすすめ出演者</span>
              <div class="toggle-row">
                <label class="toggle-main">
                  <input type="checkbox" checked>
                  おすすめ出演者に設定する
                </label>
                <span class="toggle-pill">ONでトップページ・動画詳細で優先表示想定</span>
              </div>
            </div>
            <div class="action-row">
              <button class="btn primary">更新する</button>
              <a class="btn" href="./casts.html">一覧へ戻る</a>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
