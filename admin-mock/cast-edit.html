<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出演者編集 | Video Store Admin Mock</title>
  <link rel="stylesheet" href="./admin-mock.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="brand">
        管理画面
        <span>WordPress + WooCommerce</span>
      </div>
      <ul class="menu">
        <li><a href="./dashboard.html">ダッシュボード</a></li>
        <li><a href="./videos.html">動画管理</a></li>
        <li><a href="./members.html">会員管理</a></li>
        <li><a href="./orders.html">注文管理</a></li>
        <li><a href="./inquiries.html">お問い合わせ管理</a></li>
        <li><a class="active" href="./casts.html">出演者管理</a></li>
        <li><a href="./genres.html">ジャンル管理</a></li>
        <li><a href="./contents.html">コンテンツ管理</a></li>
        <li><a href="./news.html">NEWS管理</a></li>
        <li><a href="./rankings.html">運営セレクト管理</a></li>
        <li><a href="./analytics-dashboard.html">アクセス解析</a></li>
      </ul>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 class="page-title">出演者編集</h1>
          <p class="page-subtitle">出演者ID: CAST-0012</p>
        </div>
        <div class="action-row">
          <a class="btn" href="./change-history.html?entity=cast&id=CAST-0012">変更履歴</a>
          <a class="btn" href="./cast-detail.html">詳細へ戻る</a>
          <button class="btn primary">更新する</button>
        </div>
      </header>

      <div class="content">
        <section class="card">
          <div class="card-head"><h2 class="card-title">編集項目</h2></div>
          <div class="card-body form-stack">
            <label class="field"><span>出演者名</span><input class="input" type="text" value="佐藤 梨花"></label>
            <label class="field">
              <span class="field-label-with-hint"><span>紹介文</span><span class="field-hint">最大: 120文字</span></span>
              <textarea class="input textarea" rows="8" maxlength="120">テキストテキスト。出演者紹介文。</textarea>
            </label>
            <label class="field">
              <span class="field-label-with-hint"><span>出演者画像（WordPressメディア）</span><span class="field-hint">推奨: 800x800（1:1）</span></span>
              <div class="action-row">
                <input class="input" type="text" value="/wp-content/uploads/2026/03/cast-0012.jpg">
                <button class="btn" type="button">メディアから選択</button>
              </div>
            </label>
            <label class="field"><span>公開状態</span>
              <select class="select">
                <option selected>公開</option>
                <option>公開準備中</option>
                <option>非公開</option>
              </select>
            </label>
            <div class="action-row">
              <button class="btn primary">更新する</button>
              <a class="btn" href="./casts.html">一覧へ戻る</a>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="./admin-mock.js"></script>
</body>
</html>
