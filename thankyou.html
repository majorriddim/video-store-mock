<!doctype html>
<html lang="ja">
<head>

  <title>サンクスページ | Video-Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="product.html">
        <span class="logo-mark" aria-hidden="true"></span>
        <span>Video-Store</span>
      </a>
      <nav class="header-nav">
        <a class="nav-link" data-page="product.html" href="product.html">トップ</a>

      <div class="cta-group">
        <button class="btn btn-primary" data-action="finalize-purchase">マイページへ</button>
        <a class="btn btn-secondary" href="product.html">商品ページへ戻る</a>
      </div>
    </section>

  <footer class="site-footer">

    <div>決済連携はモックのため省略し、画面遷移のみ再現しています</div>

    </div>
