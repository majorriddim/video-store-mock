<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品ページ | Video-Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="product.html">
        <span class="logo-mark" aria-hidden="true"></span>
        <span>Video-Store</span>
      </a>
      <nav class="header-nav">
        <a class="nav-link" data-page="product.html" href="product.html">商品</a>
        <a class="nav-link" data-page="mypage.html" href="mypage.html">購入済み動画一覧</a>
        <a class="nav-link" data-page="login.html" href="login.html">ログイン</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <article class="card hero-main">
        <div class="badge-row">
          <span class="badge">今週の注目作品</span>
          <span class="mini-badge">新着</span>
          <span class="mini-badge">おすすめ</span>
        </div>
        <h1>テキストテキスト</h1>
        <p class="lead">テキストテキスト</p>
        <div class="price-box">
          <span class="price">¥1,200</span>
          <span class="tax-note">税込 / 買い切り</span>
        </div>
        <div class="cta-group">
          <button class="btn btn-primary" data-action="buy-now" data-video-id="v1">この動画を購入</button>
          <a class="btn btn-secondary" href="product-detail.html?video=v1">詳細を見る</a>
        </div>
      </article>

      <aside class="card side-panel mock-panel">
        <h2>モック確認パネル</h2>
        <p><span data-auth-status class="status-chip status-guest">未ログイン</span></p>
        <p class="helper">このパネルはクライアント確認用です。本番では表示しません。</p>
        <div class="inline-actions">
          <button class="btn btn-ghost" data-action="mock-login">ログイン済みにする</button>
          <button class="btn btn-ghost" data-action="mock-logout">未ログインに戻す</button>
          <button class="btn btn-ghost" data-action="mock-clear">未購入に戻す</button>
        </div>
      </aside>
    </section>

    <section class="card section">
      <h2>販売中の単発動画</h2>
      <div id="productCatalog" class="video-grid"></div>
    </section>
  </main>

  <footer class="container">
    <div>動画の単品販売を想定したフロントモック（WordPress実装前提）</div>
    <div class="footer-links">
      <a href="tokusho.html">特定商取引法に基づく表記</a>
      <a href="terms.html">利用規約</a>
      <a href="privacy.html">プライバシーポリシー</a>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
