<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定 | Video-Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="product.html">
        <span class="logo-mark" aria-hidden="true"></span>
        <span>Video-Store</span>
      </a>
      <nav class="header-nav">
        <a class="nav-link" data-page="product.html" href="product.html">商品</a>
        <a class="nav-link" data-page="mypage.html" href="mypage.html">購入済み動画一覧</a>
        <a class="nav-link" data-page="login.html" href="login.html">ログイン</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card login-box">
      <span class="badge">パスワード再設定</span>
      <h1>パスワードをお忘れの方</h1>
      <p class="lead">登録済みメールアドレスを入力してください。再設定案内を送信します。（モック）</p>
      <form id="forgotPasswordForm">
        <div class="form-row">
          <label for="forgotEmail">メールアドレス</label>
          <input id="forgotEmail" type="email" value="demo@example.com" required>
        </div>
        <div class="cta-group">
          <button class="btn btn-primary" type="submit">再設定メールを送信</button>
          <a class="btn btn-ghost" href="login.html">ログインへ戻る</a>
        </div>
      </form>
      <p id="forgotMessage" class="helper" style="margin-top:14px;"></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>パスワード再設定は画面遷移確認用のモック実装です</div>
      <div class="footer-links">
        <a href="tokusho.html">特定商取引法に基づく表記</a>
        <a href="terms.html">利用規約</a>
        <a href="privacy.html">プライバシーポリシー</a>
        <a href="faq.html">よくある質問</a>
        <a href="contact.html">お問い合わせ</a>
      </div>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
