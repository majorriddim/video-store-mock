<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会員登録 | Video-Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="product.html">
        <span class="logo-mark" aria-hidden="true"></span>
        <span>Video-Store</span>
      </a>
      <nav class="header-nav">
        <a class="nav-link" data-page="product.html" href="product.html">商品</a>
        <a class="nav-link" data-page="mypage.html" href="mypage.html">購入済み動画一覧</a>
        <a class="nav-link" data-page="login.html" href="login.html">ログイン</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card login-box">
      <span class="badge">新規会員登録</span>
      <h1>会員登録</h1>
      <p class="lead">購入・視聴のための会員登録モックです。入力内容はダミーで構いません。</p>
      <form id="registerForm">
        <div class="form-row">
          <label for="registerName">お名前</label>
          <input id="registerName" type="text" value="テキストテキスト" required>
        </div>
        <div class="form-row">
          <label for="registerEmail">メールアドレス</label>
          <input id="registerEmail" type="email" value="demo@example.com" required>
        </div>
        <div class="form-row">
          <label for="registerPassword">パスワード</label>
          <input id="registerPassword" type="password" value="password123" required>
          <p class="helper">8文字以上で入力してください。</p>
        </div>
        <div class="form-row">
          <label for="registerPasswordConfirm">パスワード（確認）</label>
          <input id="registerPasswordConfirm" type="password" value="password123" required>
        </div>
        <div class="form-row">
          <label>
            <input id="registerAgree" type="checkbox" style="width:auto; margin-right:8px;">
            利用規約とプライバシーポリシーに同意して登録します
          </label>
          <p class="helper"><a href="terms.html">利用規約</a> / <a href="privacy.html">プライバシーポリシー</a></p>
        </div>
        <p id="registerMessage" class="helper" style="color:#b42318;"></p>
        <div class="cta-group">
          <button class="btn btn-primary" type="submit">登録して続ける</button>
          <a class="btn btn-ghost" href="login.html">ログインへ戻る</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="container">
    <div>会員登録は画面遷移確認用のモック実装です</div>
    <div class="footer-links">
      <a href="tokusho.html">特定商取引法に基づく表記</a>
      <a href="terms.html">利用規約</a>
      <a href="privacy.html">プライバシーポリシー</a>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
