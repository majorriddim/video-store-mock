<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会員登録 | Video-Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="product.html">
        <span class="logo-mark" aria-hidden="true"></span>
        <span>Video-Store</span>
      </a>
      <nav class="header-nav">
        <a class="nav-link" data-page="product.html" href="product.html">トップ</a>
        <a class="nav-link" data-page="mypage.html" href="mypage.html">マイページ</a>
        <a class="nav-link" data-page="login.html" href="login.html">ログイン</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card login-box">
      <span class="badge">新規会員登録</span>
      <h1>会員登録</h1>
      <form id="registerForm">
        <input type="hidden" name="cf-turnstile-response" value="">
        <input class="hp-field" type="text" name="website" value="" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="form-row">
          <label for="registerEmail">メールアドレス</label>
          <input id="registerEmail" type="email" value="demo@example.com" required>
          <p class="helper">登録はメールアドレスとパスワードのみで完了します。</p>
        </div>
        <div class="form-row">
          <label for="registerPassword">パスワード</label>
          <input id="registerPassword" type="password" value="password123" required>
          <p class="helper">8文字以上で入力してください。</p>
        </div>
        <div class="form-row">
          <label for="registerPasswordConfirm">パスワード（確認）</label>
          <input id="registerPasswordConfirm" type="password" value="password123" required>
        </div>
        <div class="form-row">
          <label>
            <input id="registerAgree" type="checkbox" style="width:auto; margin-right:8px;">
            利用規約とプライバシーポリシーに同意して登録します
          </label>
          <p class="helper"><a href="terms.html">利用規約</a> / <a href="privacy.html">プライバシーポリシー</a></p>
        </div>
        <p id="registerMessage" class="helper" style="color:#b42318;"></p>
        <div class="human-verification" data-human-verification="register">
          <p class="human-verification-label">認証</p>
          <div class="turnstile-widget" data-turnstile-widget>
            <label class="turnstile-check">
              <input type="checkbox" data-turnstile-complete>
              <span>認証チェック</span>
            </label>
            <div class="turnstile-brand">
              <strong>Turnstile</strong>
              <span>Privacy - Terms</span>
            </div>
          </div>
        </div>
        <div class="cta-group">
          <button id="registerSubmit" class="btn btn-primary" type="submit">登録して続ける</button>
          <a class="btn btn-ghost" href="login.html">ログインへ戻る</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
    <div class="footer-links">
      <a href="tokusho.html">特定商取引法に基づく表記</a>
      <a href="terms.html">利用規約</a>
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="faq.html">よくある質問</a>
      <a href="contact.html">お問い合わせ</a>
    </div>
  
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
