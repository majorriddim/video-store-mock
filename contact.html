<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | Video-Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="product.html">
        <span class="logo-mark" aria-hidden="true"></span>
        <span>Video-Store</span>
      </a>
      <nav class="header-nav">
        <a class="nav-link" data-page="product.html" href="product.html">トップ</a>
        <a class="nav-link" data-page="videos.html" href="videos.html">動画を探す</a>
        <a class="nav-link" data-page="casts.html" href="casts.html">出演者一覧</a>
        <a class="nav-link" data-page="genres.html" href="genres.html">ジャンル一覧</a>
        <a class="nav-link" data-page="login.html" href="login.html">ログイン</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card login-box">
      <span class="badge">サポート</span>
      <h1>お問い合わせ</h1>
      <p class="lead">購入前のご質問、視聴に関する不具合、請求に関するご相談を受け付けています。</p>
      <form id="contactForm">
        <div class="form-row">
          <label for="contactName">お名前</label>
          <input id="contactName" type="text" value="テキストテキスト" required>
        </div>
        <div class="form-row">
          <label for="contactEmail">メールアドレス</label>
          <input id="contactEmail" type="email" value="demo@example.com" required>
        </div>
        <div class="form-row">
          <label for="contactType">お問い合わせ種別</label>
          <select id="contactType" required>
            <option value="purchase">購入前の質問</option>
            <option value="playback">視聴不具合</option>
            <option value="billing">請求・決済</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div class="form-row">
          <label for="contactBody">お問い合わせ内容</label>
          <textarea id="contactBody" rows="6" required>テキストテキスト</textarea>
        </div>
        <button class="btn btn-primary" type="submit">送信する</button>
      </form>
      <div id="contactMessage" style="margin-top: 12px;"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
    <div>サポート問い合わせ用のモックページ</div>
    <div class="footer-links">
      <a href="tokusho.html">特定商取引法に基づく表記</a>
      <a href="terms.html">利用規約</a>
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="faq.html">よくある質問</a>
      <a href="contact.html">お問い合わせ</a>
    </div>
  
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
